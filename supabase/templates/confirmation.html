<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to KnowThyNeighbor</title>
</head>
<body style="margin:0; padding:0; background-color:#C4A366; font-family:Georgia, 'Times New Roman', serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 16px;">
    <tr>
      <td align="center">
        <table width="440" cellpadding="0" cellspacing="0" style="background-color:#FDF8ED; box-shadow:2px 3px 8px rgba(60,40,20,0.18), 0 1px 2px rgba(60,40,20,0.1); max-width:100%;">
          <tr>
            <td style="padding:48px 36px 36px; text-align:center;">
              <h1 style="margin:0 0 8px; font-size:28px; color:#2B4570; font-family:Georgia, serif; font-weight:normal;">
                KnowThyNeighbor
              </h1>
              <p style="margin:0 0 28px; font-size:16px; color:#3D5A8A; line-height:1.5;">
                Real neighbors. Real meals. Real connection.
              </p>
              <p style="margin:0 0 12px; font-size:18px; color:#2B4570; line-height:1.6;">
                Welcome! Tap the button below to confirm your email and get started.
              </p>
              <p style="margin:0 0 32px; font-size:14px; color:#3D5A8A;">
                This link expires in 5 minutes.
              </p>
              <a href="{{ .ConfirmationURL }}"
                 style="display:inline-block; padding:14px 36px; background-color:#CC4433; color:#FDF8ED; font-size:16px; font-weight:bold; text-decoration:none; text-transform:uppercase; letter-spacing:0.04em; font-family:Arial, Helvetica, sans-serif;">
                Confirm Email
              </a>
              <p style="margin:32px 0 0; font-size:13px; color:#3D5A8A; line-height:1.5;">
                If you didn&rsquo;t sign up, you can safely ignore this email.
              </p>
            </td>
          </tr>
        </table>
        <p style="margin:24px 0 0; font-size:12px; color:#F0E8D5; text-align:center;">
          &copy; KnowThyNeighbor &mdash; nextdoorish.com
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
